<!DOCTYPE html>

<title>Personal CRM</title>
<style>
/* ===== Jaguar Metallic Blue (v0.4.2) — paleta centralizada =====
   Las variables --color-* son la fuente única. Los alias antiguos (--bg, --card, --ink, --mute, --line, --acc, --acc2, --warn, --ok, --onacc)
   se mantienen porque el marcado generado por JavaScript todavía los usa. */
:root{
--color-obsidian:#07111D;--color-night-blue:#10243A;--color-metallic-blue:#1769AA;--color-electric-blue:#368FCB;--color-silver:#A8BACB;--color-ice-white:#E8EDF2;
--color-background:#091522;--color-surface:#10243A;--color-surface-alt:#172E45;--color-border:rgba(168,186,203,.16);
--color-text-primary:#E8EDF2;--color-text-secondary:#A8BACB;--color-text-muted:#71869B;
--color-success:#36B889;--color-warning:#E5AA52;--color-danger:#E36B75;
--color-primary:#1769AA;--color-primary-hover:#368FCB;--color-focus:rgba(54,143,203,.35);
--color-accent-text:#6DB4E3;--color-field:#0B1A2B;--field-border:rgba(168,186,203,.26);--color-on-primary:#F2F6FA;--color-on-hover:#07111D;
--tint-accent:rgba(54,143,203,.14);--tint-danger:rgba(227,107,117,.12);--tint-warning:rgba(229,170,82,.14);
--grad-primary:linear-gradient(180deg,#1A6FB2,#145F9A);--grad-hover:linear-gradient(180deg,#4BA0D6,#368FCB);
--sheen:linear-gradient(180deg,rgba(232,237,242,.035),rgba(232,237,242,0) 45%);
--chrome-line:linear-gradient(90deg,transparent,rgba(168,186,203,.5),transparent);
--shadow-card:inset 0 1px 0 rgba(232,237,242,.04),0 6px 18px rgba(0,0,0,.26);--shadow-up:0 -8px 24px rgba(0,0,0,.35);
--nav-bg:linear-gradient(180deg,#0C1D30,#07111D);
color-scheme:dark;
--bg:var(--color-background);--card:var(--color-surface);--ink:var(--color-text-primary);--mute:var(--color-text-secondary);--line:var(--color-border);--acc:var(--color-accent-text);--acc2:var(--tint-accent);--warn:var(--color-danger);--ok:var(--color-success);--onacc:var(--color-obsidian);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-theme="light"]{
color-scheme:light;
--color-background:#E6ECF2;--color-surface:#F8FAFC;--color-surface-alt:#EAF0F6;--color-border:rgba(16,36,58,.15);
--color-text-primary:#0E2236;--color-text-secondary:#47607A;--color-text-muted:#6B8095;
--color-success:#17734F;--color-warning:#A8691A;--color-danger:#B93A46;--color-focus:rgba(23,105,170,.3);
--color-accent-text:#14609F;--color-field:#FFFFFF;--field-border:rgba(16,36,58,.28);
--tint-accent:rgba(23,105,170,.1);--tint-danger:rgba(185,58,70,.1);--tint-warning:rgba(168,105,26,.12);
--sheen:none;--shadow-card:0 1px 2px rgba(16,36,58,.08),0 4px 14px rgba(16,36,58,.07);--shadow-up:0 -4px 16px rgba(16,36,58,.1);
--nav-bg:#F8FAFC;--onacc:#FFFFFF}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--color-background)}
*,*::before,*::after{box-sizing:border-box}
*{scrollbar-width:thin;scrollbar-color:rgba(168,186,203,.3) transparent}
::selection{background:var(--color-focus)}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.5 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;background:radial-gradient(900px 420px at 12% -8%,rgba(23,105,170,.16),transparent 70%),var(--bg)}
:root[data-theme="light"] body{background:var(--bg)}
#app{display:flex;min-height:100vh}
.side{width:244px;padding:22px 14px;border-right:1px solid var(--line);background:var(--nav-bg);position:sticky;top:0;height:100vh;display:none;flex-direction:column;gap:3px}
.brand{position:relative;font-size:19px;font-weight:700;letter-spacing:-.01em;padding:0 10px 16px;margin-bottom:10px;color:var(--ink)}
.brand::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:1px;background:var(--chrome-line)}
.brand small{display:block;font-size:12px;font-weight:400;color:var(--mute);letter-spacing:.02em}
.side button{display:flex;gap:10px;align-items:center;border:1px solid transparent;background:none;color:var(--mute);padding:10px 12px;border-radius:10px;font:inherit;cursor:pointer;text-align:left;min-height:44px;transition:background .18s,color .18s,border-color .18s}
.side button:hover{color:var(--ink);background:var(--tint-accent)}
.side button.on{background:var(--grad-primary);border-color:rgba(54,143,203,.5);color:var(--color-on-primary);font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
main{flex:1;min-width:0;padding:18px 16px 100px;max-width:960px;margin:0 auto;width:100%}
h1{font-size:26px;font-weight:650;letter-spacing:-.02em;margin:0 0 2px;color:var(--ink)}
h2{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;letter-spacing:.01em;margin:24px 0 10px;color:var(--ink)}
h2::before{content:"";width:3px;height:14px;border-radius:2px;background:linear-gradient(180deg,var(--color-electric-blue),var(--color-metallic-blue));flex:none}
.sub{color:var(--mute);margin:0 0 16px}.sub::first-letter{text-transform:uppercase}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--color-surface);border-top:1px solid var(--line);box-shadow:var(--shadow-up);padding:4px 2px calc(4px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{position:relative;flex:1;min-width:0;min-height:48px;border:0;background:none;color:var(--mute);font:inherit;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px 0;cursor:pointer;transition:color .18s}
.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button.on{color:var(--color-accent-text);font-weight:600}
.tabs button.on::before{content:"";position:absolute;top:-5px;left:24%;right:24%;height:2px;border-radius:0 0 2px 2px;background:var(--color-electric-blue)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:var(--sheen),var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;overflow-wrap:anywhere;box-shadow:var(--shadow-card);transition:border-color .18s,transform .15s}
.card[data-a]:active{transform:scale(.995)}
@media(hover:hover){.card[data-a]:hover{border-color:rgba(54,143,203,.5);transform:translateY(-1px)}}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px}
.kpi{position:relative;overflow:hidden;background:var(--sheen),var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0;box-shadow:var(--shadow-card)}
.kpi::before{content:"";position:absolute;left:14px;right:14px;top:0;height:1px;background:var(--chrome-line)}
.kpi b{display:block;font-size:24px;font-weight:650;letter-spacing:-.02em;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;color:var(--ink)}.kpi span{color:var(--mute);font-size:13px}
.row{display:flex;align-items:center;gap:8px}.row.sp{justify-content:space-between}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.mute{color:var(--mute);font-size:13px}.warn{color:var(--color-danger)}
.btn{border:1px solid var(--line);background:var(--color-surface-alt);color:var(--ink);padding:9px 14px;border-radius:10px;font:inherit;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .18s,border-color .18s,color .18s,transform .12s,box-shadow .18s}
.btn:hover{border-color:var(--color-electric-blue)}
.btn:active{transform:translateY(1px)}
.btn.p{background:var(--grad-primary);border-color:rgba(54,143,203,.5);color:var(--color-on-primary);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 8px rgba(7,17,29,.3)}
.btn.p:hover{background:var(--grad-hover);border-color:#5BAADF;color:var(--color-on-hover)}
.btn.sm{padding:6px 10px;min-height:44px;min-width:44px;font-size:13px}
.btn.d{color:var(--color-danger)}.btn.d:hover{border-color:var(--color-danger);background:var(--tint-danger)}
a.btn{text-decoration:none;color:var(--ink)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--color-field);border:1px solid var(--field-border);border-radius:10px;padding:9px 11px;min-height:44px;transition:border-color .18s,box-shadow .18s}
input::placeholder,textarea::placeholder{color:var(--color-text-muted);opacity:1}
option{background:var(--color-surface);color:var(--ink)}
textarea{min-height:140px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
:focus-visible{outline:2px solid var(--color-electric-blue);outline-offset:2px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--color-electric-blue);box-shadow:0 0 0 3px var(--color-focus)}
input:user-invalid,select:user-invalid,textarea:user-invalid{border-color:var(--color-danger)}
input:user-invalid:focus{box-shadow:0 0 0 3px var(--tint-danger)}
summary{cursor:pointer}
.chk{width:32px;height:32px;border-radius:9px;border:1.5px solid var(--mute);background:none;color:var(--onacc);display:grid;place-items:center;cursor:pointer;flex:none;padding:0;transition:background .18s,border-color .18s}
.chk:hover{border-color:var(--color-electric-blue)}
.chk.on{background:var(--color-success);border-color:var(--color-success)}
.done .t{text-decoration:line-through;color:var(--mute)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--tint-accent);color:var(--color-accent-text);margin-left:6px}
.tag.demo{background:transparent;border:1px dashed var(--mute);color:var(--mute)}
.tag.hi{background:var(--tint-warning);color:var(--color-warning)}
.tag.dnc{background:var(--tint-danger);color:var(--color-danger);border:1px solid var(--color-danger)}
.empty{text-align:center;color:var(--mute);padding:24px 12px;border:1px dashed var(--line);border-radius:14px;margin-bottom:10px}
.bar{height:8px;border-radius:99px;background:var(--tint-accent);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#145F9A,var(--color-electric-blue));transition:width .35s}
.cols{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}.col{min-width:240px;flex:1}
.note{background:var(--tint-accent);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:13px}
.note.err{background:var(--tint-danger);border-left:4px solid var(--color-danger)}
.msg{position:sticky;top:6px;z-index:4;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.note.msg{background:linear-gradient(var(--tint-accent),var(--tint-accent)),var(--color-surface)}
.note.msg.err{background:linear-gradient(var(--tint-danger),var(--tint-danger)),var(--color-surface)}
.st{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.seg{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}.seg button{flex:none;border:1px solid var(--line);background:var(--color-surface-alt);color:var(--ink);border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;min-height:44px;cursor:pointer;transition:background .18s,border-color .18s,color .18s}.seg button:hover{border-color:var(--color-electric-blue)}.seg button.on{background:var(--grad-primary);border-color:rgba(54,143,203,.5);color:var(--color-on-primary)}
.tl{border-left:2px solid rgba(54,143,203,.4);padding:2px 0 12px 12px;margin-left:4px;overflow-wrap:anywhere}
.chip{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--mute);margin:0 0 10px}.chip i{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}.chip.ok i{background:var(--color-success)}.chip.err{color:var(--color-danger)}.chip.err i{background:var(--color-danger)}
@media(min-width:760px){.side{display:flex}.tabs{display:none}main{padding:30px 32px 40px}.grid{grid-template-columns:repeat(4,1fr)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* ===== Extensión: Digital Minimalism (detalles tecnológicos ~20 %) =====
   Solo opacity/transform en animaciones; sin blur ni filtros; breves y finitas (aptas para Android). */
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
body.nv main>*{animation:rise .24s ease-out both}
.note.msg{animation:rise .2s ease-out both}
.side button.on::after{content:"";margin-left:auto;width:6px;height:6px;border-radius:50%;background:#A9D6F3;box-shadow:0 0 8px var(--color-electric-blue)}
.kpi::after{content:"";position:absolute;left:0;top:14px;width:2px;height:16px;border-radius:0 2px 2px 0;background:var(--color-electric-blue)}
.kpi span,.lbl{display:block;font-size:12px;letter-spacing:.03em;color:var(--mute)}
.kpi b,.big{font-size:28px;line-height:1.15;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big{display:block;color:var(--ink)}
.card .card{box-shadow:none;background:var(--color-surface-alt);border-color:var(--line)}
.pulse{display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.pulse::before{content:"";position:absolute;left:14px;right:14px;top:0;height:1px;background:var(--chrome-line)}
.pulse svg.spark{width:140px;height:36px;flex:none;overflow:visible}
.pulse svg.spark rect{fill:var(--color-metallic-blue);opacity:.55}.pulse svg.spark rect.now{fill:var(--color-electric-blue);opacity:1}
.trend{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}.trend svg.i{width:16px;height:16px}
.trend.up{color:var(--color-success)}.trend.down{color:var(--color-warning)}
.empty::before{content:"";display:block;width:32px;height:1px;margin:0 auto 14px;background:var(--chrome-line)}
.chip:not(.ok):not(.err) i{animation:blink .9s ease-in-out 3}
.chip.ok i{box-shadow:0 0 6px rgba(54,184,137,.6)}
.sub[role=status]::after{content:"";display:inline-block;width:6px;height:6px;margin-left:8px;border-radius:50%;background:var(--color-electric-blue);animation:blink .9s ease-in-out 6}
.bar{height:6px}
details>summary{transition:color .18s}details[open]>summary{color:var(--ink)}
@media(min-width:760px){main{padding-top:34px}.kpi{padding:16px 18px}.card{padding:16px 18px}}

/* ===== v0.5: WhatsApp y Google Calendar ===== */
.btn.wa{color:var(--color-success);padding:0;min-width:44px}.btn.wa:hover{border-color:var(--color-success);background:rgba(54,184,137,.12)}
.waic{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:rgba(54,184,137,.14);color:var(--color-success)}
.waic svg.i{width:18px;height:18px}
.lnk{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--color-accent-text);font:inherit;font-size:13px;padding:8px 0;min-height:40px;cursor:pointer;transition:color .18s}
.lnk{text-align:left}.lnk:hover{color:var(--color-electric-blue)}.lnk svg.i{width:16px;height:16px}
.gcp{border:1px solid var(--line);border-left:2px solid var(--color-electric-blue);border-radius:12px;background:var(--color-surface-alt);padding:12px 14px;margin:-4px 0 10px;animation:rise .2s ease-out both}
.gcp .row .grow{min-width:120px}

#pwa-install{position:fixed;right:14px;top:calc(12px + env(safe-area-inset-top,0px));z-index:20;display:none;border:1px solid rgba(54,143,203,.65);border-radius:999px;padding:9px 13px;background:linear-gradient(180deg,#1A6FB2,#145F9A);color:#F2F6FA;font:600 13px sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.28)}
#pwa-install.show{display:block}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== Personal CRM v0.4 — archivo único, modular =====
   Capas: 1) modelo, validación y migración  2) persistencia local  3) formularios y acciones  4) vistas y enrutador.
   Persistencia: IndexedDB → localStorage → solo respaldos manuales. Esquema de datos v2 (migra desde v1 = Personal CRM v0.3). */
const SCHEMA=2,LOC='es-NI';
const STAGES=[['nuevo','Nuevo contacto'],['iniciado','Contacto iniciado'],['conversacion','Conversación inicial'],['descubrimiento','Descubrimiento'],['pres_pend','Presentación pendiente'],['pres_hecha','Presentación realizada'],['seguimiento','Seguimiento y dudas'],['evaluacion','Evaluación'],['decision','Decisión pendiente'],['incorporado','Incorporado'],['cliente','Cliente'],['no_interesado','No interesado'],['pausa','En pausa / futuro'],['no_contactar','No contactar']];
const CLOSED=['incorporado','cliente','no_interesado','pausa','no_contactar'];
const SOURCES=['Facebook','Instagram','TikTok','WhatsApp','Recomendación','Evento o taller','Contacto presencial','Formulario','Otra'];
const CHANNELS=['WhatsApp','Instagram','Facebook','TikTok','Llamada','Presencial','Videollamada','Correo electrónico','Otro'];
const ITYPES=[['frio','Prospección en frío'],['conversacion','Conversación inicial'],['seguimiento','Seguimiento'],['llamada','Llamada'],['videollamada','Videollamada'],['presentacion','Presentación'],['reunion','Reunión o taller'],['dudas','Resolución de dudas'],['mensaje','Mensaje'],['otra','Otra']];
const ATYPES=[['seguimiento','Seguimiento'],['llamada','Llamada'],['videollamada','Videollamada'],['presentacion','Presentación'],['reunion','Reunión'],['taller','Taller'],['tarea','Tarea personal'],['otra','Otra']];
const PRIOS=[['alta','Alta'],['media','Media'],['baja','Baja']],STATUS=[['pendiente','Pendiente'],['completada','Completada'],['cancelada','Cancelada']];
const ETAPAS=[['Lead','Prospecto'],['Contacted','Contactado'],['Proposal','Propuesta'],['Won','Ganada'],['Lost','Perdida']];
const TIPOS=[['Call','Llamada'],['Message','Mensaje'],['Meeting','Reunión'],['Note','Nota']];
const INTEREST=[['','Sin indicar'],['alto','Alto'],['medio','Medio'],['bajo','Bajo']];
const IND=[['nuevos','Prospectos nuevos'],['frio','Prospecciones en frío'],['conv','Conversaciones iniciadas'],['llamadas','Llamadas realizadas'],['pres_env','Presentaciones enviadas'],['pres_vis','Presentaciones vistas'],['pres_hec','Presentaciones realizadas'],['seg','Seguimientos realizados'],['reun','Reuniones o talleres realizados']];
const MAN=['pres_env','pres_vis'],PERIODS=[['dia','Diaria'],['semana','Semanal']];
const ENUMS={stage:STAGES,itype:ITYPES,atype:ATYPES,prio:PRIOS,status:STATUS,ostage:ETAPAS,ind:IND,mind:IND.filter(x=>MAN.includes(x[0])),period:PERIODS,interest:INTEREST};
const COLS1=['contacts','opps','tasks','acts'],NOMBRES1={contacts:'Contacto',opps:'Oportunidad',tasks:'Tarea',acts:'Actividad'};
const L=(a,v)=>(a.find(x=>x[0]===v)||[v,v])[1];
const pad=n=>String(n).padStart(2,'0');
const ymd=x=>x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());
const iso=o=>{const x=new Date();x.setDate(x.getDate()+o);return ymd(x)};
const T=()=>iso(0);
const addD=(d,n)=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()+n);return ymd(x)};
const wk=()=>{const s=addD(T(),-((new Date().getDay()+6)%7));return[s,addD(s,6)]};
const loc=i=>{const x=new Date(i);return ymd(x)+'T'+pad(x.getHours())+':'+pad(x.getMinutes())};
const uid=p=>{try{return p+'_'+crypto.randomUUID()}catch(e){}const a=new Uint8Array(12);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<12;i++)a[i]=Math.random()*256}return p+'_'+[...a].map(x=>x.toString(16).padStart(2,'0')).join('')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const fdate=d=>d?new Date(d+'T00:00').toLocaleDateString(LOC,{weekday:'short',day:'numeric',month:'short'}):'';
const money=n=>'$'+(Number(n)||0).toLocaleString(LOC);
const okDate=s=>{if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const[y,m,d]=s.split('-').map(Number),x=new Date(Date.UTC(y,m-1,d));return x.getUTCFullYear()===y&&x.getUTCMonth()===m-1&&x.getUTCDate()===d};
const okTime=s=>/^([01]\d|2[0-3]):[0-5]\d$/.test(s);
/* Validación pura: devuelve {er:[errores]} o {er:[],data:copia normalizada}. No toca el estado. */
function validateV1(d){
 const er=[],out={v:1},isO=x=>x&&typeof x==='object'&&!Array.isArray(x);

<script>
(() => {
  let deferredInstall = null;
  const b = document.createElement('button');
  b.id = 'pwa-install'; b.type = 'button'; b.textContent = 'Instalar CRM';
  document.body.appendChild(b);

    if (!deferredInstall) return;
    deferredInstall.prompt();
